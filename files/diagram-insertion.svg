<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Inserting the CR2032 battery into the Battery ePod</title><desc>Three-step schematic: position the battery, lower it in with the plus side up and press gently, then check it sits flat.</desc><defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F8FA"/><stop offset="1" stop-color="#A9B4BF"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F5A300"/></marker>
</defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="960" y="110" text-anchor="middle" font-size="56" font-weight="700" fill="#12263A">Inserting the CR2032 battery</text><text x="960" y="165" text-anchor="middle" font-size="30" fill="#4A5B6C">Position  →  Lower  →  Press flat  →  Check</text><g id="panel-1" transform="translate(80,230)"><rect x="0" y="0" width="560" height="700" rx="24" fill="#F5F7FA" stroke="#D5DDE6" stroke-width="2"/><circle cx="52" cy="58" r="28" fill="#F5A300"/><text x="52" y="69" text-anchor="middle" font-size="32" font-weight="700" fill="#12263A">1</text><text x="98" y="70" font-size="34" font-weight="700" fill="#12263A">Position</text><circle cx="250" cy="250" r="100" fill="#DCE6F0" stroke="#12263A" stroke-width="4"/><circle cx="250" cy="250" r="60" fill="#F5F7FA" stroke="#12263A" stroke-width="3"/><text x="30" y="150" font-size="18" letter-spacing="2" fill="#4A5B6C">TOP VIEW</text><circle cx="470" cy="250" r="50" fill="url(#metal)" stroke="#5B6B7B" stroke-width="3"/><text x="470" y="262" text-anchor="middle" font-size="40" font-weight="700" fill="#12263A">+</text><text x="470" y="284" text-anchor="middle" font-size="13" fill="#4A5B6C">CR2032</text><line x1="412" y1="250" x2="362" y2="250" stroke="#F5A300" stroke-width="7" marker-end="url(#ah)"/><text x="30" y="420" font-size="18" letter-spacing="2" fill="#4A5B6C">SIDE VIEW</text><rect x="110" y="585" width="280" height="25" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="110" y="545" width="20" height="65" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="370" y="545" width="20" height="65" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="300" y="470" width="220" height="38" rx="8" fill="url(#metal)" stroke="#5B6B7B" stroke-width="3"/><rect x="306" y="473" width="208" height="7" rx="3" fill="#F5A300" opacity=".9"/><rect x="352" y="428" width="116" height="28" rx="14" fill="#F5A300"/><text x="410" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#12263A">+ side up</text><text x="280" y="648" text-anchor="middle" font-size="26" fill="#12263A">Battery in one hand,</text><text x="280" y="682" text-anchor="middle" font-size="26" fill="#12263A">holder facing up</text></g><g id="panel-2" transform="translate(680,230)"><rect x="0" y="0" width="560" height="700" rx="24" fill="#F5F7FA" stroke="#D5DDE6" stroke-width="2"/><circle cx="52" cy="58" r="28" fill="#F5A300"/><text x="52" y="69" text-anchor="middle" font-size="32" font-weight="700" fill="#12263A">2</text><text x="98" y="70" font-size="34" font-weight="700" fill="#12263A">Lower and press</text><circle cx="250" cy="250" r="100" fill="#DCE6F0" stroke="#12263A" stroke-width="4"/><circle cx="250" cy="250" r="60" fill="#F5F7FA" stroke="#12263A" stroke-width="3"/><text x="30" y="150" font-size="18" letter-spacing="2" fill="#4A5B6C">TOP VIEW</text><circle cx="250" cy="250" r="50" fill="url(#metal)" stroke="#5B6B7B" stroke-width="3"/><text x="250" y="262" text-anchor="middle" font-size="40" font-weight="700" fill="#12263A">+</text><text x="250" y="284" text-anchor="middle" font-size="13" fill="#4A5B6C">CR2032</text><circle cx="250" cy="250" r="66" fill="none" stroke="#F5A300" stroke-width="5" stroke-dasharray="6 8"/><text x="30" y="420" font-size="18" letter-spacing="2" fill="#4A5B6C">SIDE VIEW</text><rect x="110" y="585" width="280" height="25" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="110" y="545" width="20" height="65" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="370" y="545" width="20" height="65" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="140" y="547" width="220" height="38" rx="8" fill="none" stroke="#5B6B7B" stroke-width="3" stroke-dasharray="10 8"/><rect x="140" y="470" width="220" height="38" rx="8" fill="url(#metal)" stroke="#5B6B7B" stroke-width="3"/><rect x="146" y="473" width="208" height="7" rx="3" fill="#F5A300" opacity=".9"/><rect x="192" y="428" width="116" height="28" rx="14" fill="#F5A300"/><text x="250" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#12263A">+ side up</text><line x1="250" y1="512" x2="250" y2="540" stroke="#F5A300" stroke-width="7" marker-end="url(#ah)"/><text x="280" y="648" text-anchor="middle" font-size="26" fill="#12263A">Lower it straight in,</text><text x="280" y="682" text-anchor="middle" font-size="26" fill="#12263A">+ side up. Press gently.</text></g><g id="panel-3" transform="translate(1280,230)"><rect x="0" y="0" width="560" height="700" rx="24" fill="#F5F7FA" stroke="#D5DDE6" stroke-width="2"/><circle cx="52" cy="58" r="28" fill="#F5A300"/><text x="52" y="69" text-anchor="middle" font-size="32" font-weight="700" fill="#12263A">3</text><text x="98" y="70" font-size="34" font-weight="700" fill="#12263A">Check it is flat</text><circle cx="250" cy="250" r="100" fill="#DCE6F0" stroke="#12263A" stroke-width="4"/><circle cx="250" cy="250" r="60" fill="#F5F7FA" stroke="#12263A" stroke-width="3"/><text x="30" y="150" font-size="18" letter-spacing="2" fill="#4A5B6C">TOP VIEW</text><circle cx="250" cy="250" r="50" fill="url(#metal)" stroke="#5B6B7B" stroke-width="3"/><text x="250" y="262" text-anchor="middle" font-size="40" font-weight="700" fill="#12263A">+</text><text x="250" y="284" text-anchor="middle" font-size="13" fill="#4A5B6C">CR2032</text><circle cx="340" cy="170" r="24" fill="#1E9E5A"/><path d="M328 170 l9 10 l17 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="420" font-size="18" letter-spacing="2" fill="#4A5B6C">SIDE VIEW</text><rect x="110" y="585" width="280" height="25" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="110" y="545" width="20" height="65" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="370" y="545" width="20" height="65" fill="#B8C7D6" stroke="#12263A" stroke-width="3"/><rect x="140" y="547" width="220" height="38" rx="8" fill="url(#metal)" stroke="#5B6B7B" stroke-width="3"/><rect x="146" y="550" width="208" height="7" rx="3" fill="#F5A300" opacity=".9"/><rect x="192" y="490" width="116" height="28" rx="14" fill="#F5A300"/><text x="250" y="510" text-anchor="middle" font-size="16" font-weight="700" fill="#12263A">+ side up</text><text x="280" y="648" text-anchor="middle" font-size="26" fill="#12263A">Sits flat and level.</text><text x="280" y="682" text-anchor="middle" font-size="26" fill="#12263A">No wobble, no gap.</text></g><text x="960" y="1010" text-anchor="middle" font-size="22" fill="#4A5B6C">Schematic for explanation only, not to scale. The real Battery ePod is shown in the video.</text></svg>